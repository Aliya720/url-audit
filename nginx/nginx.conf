# Nginx Configuration — Subpath deployment at /url-audit-project
# This nginx runs INSIDE Docker and handles internal routing.
# The host-level nginx on the VPS handles TLS and proxies here.

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API — proxy to Django/Gunicorn
    location /url-audit-project/api/ {
        rewrite ^/url-audit-project/(.*)$ /$1 break;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header SCRIPT_NAME /url-audit-project;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Django static files (admin, DRF browsable API, etc.)
    location /url-audit-project/static/ {
        alias /app/staticfiles/;
    }

    # Prometheus metrics — internal only (TRD §14)
    location /url-audit-project/metrics {
        rewrite ^/url-audit-project/(.*)$ /$1 break;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React SPA — serve static build
    location /url-audit-project/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /url-audit-project/index.html;
    }

    # Redirect /url-audit-project (no trailing slash) → /url-audit-project/
    location = /url-audit-project {
        return 301 /url-audit-project/;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}

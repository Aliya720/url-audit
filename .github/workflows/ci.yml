# CI Pipeline — TRD §13
# Lint → Test (with real Postgres + Redis) → Docker Build

name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulsewatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        working-directory: ./backend
        run: flake8 . --max-line-length=120 --exclude=migrations

      - name: Format check (black)
        working-directory: ./backend
        run: black --check --line-length=120 .

      - name: Run tests with coverage
        working-directory: ./backend
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml -v
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/pulsewatch_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_TASK_ALWAYS_EAGER: "True"
          DEBUG: "True"
          ALLOWED_HOSTS: "*"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

      - name: Build Docker image
        run: docker build -t pulsewatch-web ./backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build
